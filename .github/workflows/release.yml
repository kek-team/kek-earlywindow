name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew
      - run: ./gradlew build --console=plain
      - name: Публикация jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          jar="build/libs/kek-earlywindow-$version.jar"
          sha256sum "$jar" | tee "$jar.sha256"
          gh release create "$GITHUB_REF_NAME" "$jar" "$jar.sha256" --title "$GITHUB_REF_NAME" --generate-notes
